services:
  cabonnet:
    build: .
    container_name: cabonnet
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Precisa ficar dentro de um DIRETORIO montado para a rotacao funcionar.
      - CABONNET_LOG_FILE=/app/logs/cabonnet_server.log
    volumes:
      # Sem isto, todo `docker compose up --build` recria o container e o
      # SQLite (histórico de OS, cadastro de usuários/senhas, técnicos etc.)
      # nasce vazio de novo — era exatamente por isso que o admin sumia
      # a cada deploy. ./logs:/app/logs (removido) não persistia nada real:
      # nenhum código escreve em /app/logs, os arquivos ficam na raiz do app.
      - ./cabonnet_data.db:/app/cabonnet_data.db
      # Diretorio, nao arquivo: o RotatingFileHandler renomeia o log ao girar,
      # e renomear um bind-mount de arquivo unico falha dentro do container —
      # foi assim que o log ficou congelado de 23/07 a 09/09, com o app vivo.
      - ./logs:/app/logs
      - ./jun_historico.json:/app/jun_historico.json
      - ./Backup:/app/Backup
